name: Recovery integration tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: bipe_test
          POSTGRES_PASSWORD: bipe-test-only
          POSTGRES_DB: bipe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bipe_test -d bipe_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BIPE_TEST_DATABASE_URL: postgres://bipe_test:bipe-test-only@127.0.0.1:5432/bipe_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration
