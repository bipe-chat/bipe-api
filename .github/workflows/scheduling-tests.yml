name: Scheduling vectors

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scheduling:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        timezone: [UTC, Pacific/Auckland]
    env:
      TZ: ${{ matrix.timezone }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:scheduling
